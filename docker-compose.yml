version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: smartvision_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smartvision
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartvision_backend
    command: >
      bash -c "python manage.py makemigrations api &&
               python manage.py migrate && 
               python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/smartvision
    depends_on:
      - db

  frontend:
    image: node:20-alpine
    container_name: smartvision_frontend
    working_dir: /app
    command: >
      sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"

volumes:
  postgres_data:
